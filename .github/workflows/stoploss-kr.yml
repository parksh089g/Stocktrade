# 국내 주식 장 마감 전 손절 확인. 보유 종목을 지금 가격으로 보고 손절 매도만 낸다(매수 안 함).
# 알릴 일(주문, 체결, 경고, 오류)이 없으면 알림을 보내지 않는다. 설정 방법은 docs/SETUP.md 4장.
name: stoploss-kr

on:
  schedule:
    # 한국 시간 월~금 13:17(UTC 04:17). 장 마감(15:30) 2시간쯤 전.
    # 정각은 GitHub 예약 실행이 몰려 늦어지기 쉬워 피했다. 마감 뒤로 밀리면 엔진이 주문하지 않는다.
    - cron: "17 4 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 시험 실행(계산만 하고 주문하지 않음)
        type: boolean
        default: true
      scheduled:
        description: 예약 실행으로 돌리기(Cloudflare 예약이 쓴다. 손으로 실행할 때는 끈 채로 둔다)
        type: boolean
        default: false

permissions:
  contents: read

# 국내/미국 실행이 겹치지 않게 차례로 돈다(같은 KIS 키의 초당 호출 한도를 나눠 쓰지 않게)
concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  run:
    # 예약 실행(GitHub 예약, Cloudflare 예약)은 저장소 변수 SCHEDULE_ENABLED가 true일 때만 돈다.
    # 손으로 실행은 언제나 된다.
    if: (github.event_name == 'workflow_dispatch' && inputs.scheduled != true) || vars.SCHEDULE_ENABLED == 'true'
    uses: ./.github/workflows/engine.yml
    with:
      market: KR
      dry_run: ${{ inputs.dry_run == true }}
      scheduled: ${{ github.event_name == 'schedule' || inputs.scheduled == true }}
      stop_loss_only: true
    secrets: inherit
