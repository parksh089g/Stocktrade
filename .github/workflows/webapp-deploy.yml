# 폰 웹앱(webapp/)을 Cloudflare Pages에 올린다. 설정 방법은 docs/SETUP.md 6-4.
#
# main에 웹앱이 바뀌어 올라왔을 때(PR 머지)와 손으로 실행할 때만 돈다. PR(포크 포함)에서는 돌지 않는다.
# 웹앱에 들어가는 값(VITE_*)은 화면에 실리는 공개용 값이라 Variables에 둔다.
# Variables가 비어 있으면 엔진용 Secret에서 공개 부분만 채운다: 주소는 SUPABASE_URL,
# 웹 푸시 공개키는 VAPID_PRIVATE_KEY에서 계산한 공개키. 개인키 자체는 빌드에 넣지 않고 로그에 찍지 않는다.
name: webapp-deploy

on:
  push:
    branches: [main]
    paths:
      - webapp/**
      - config/universe.toml
      - .github/workflows/webapp-deploy.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webapp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # 이 저장소에서만(포크에서는 돌지 않는다), main 코드로만
    if: github.repository == 'parksh089g/Stocktrade' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY }}
      VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: 빈 값은 엔진 Secret에서 공개 부분만 채우기
        env:
          ENGINE_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          ENGINE_VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
        run: |
          if [ -z "$VITE_SUPABASE_URL" ] && [ -n "$ENGINE_SUPABASE_URL" ]; then
            echo "VITE_SUPABASE_URL=$ENGINE_SUPABASE_URL" >> "$GITHUB_ENV"
            echo "Supabase 주소는 Secret SUPABASE_URL과 같은 값을 씁니다."
          fi
          if [ -z "$VITE_VAPID_PUBLIC_KEY" ] && [ -n "$ENGINE_VAPID_PRIVATE_KEY" ]; then
            # 개인키(base64url 32바이트)에서 P-256 공개키(압축 안 한 65바이트, base64url)를 계산한다
            public=$(node -e 'const c=require("node:crypto");const e=c.createECDH("prime256v1");e.setPrivateKey(Buffer.from(process.env.ENGINE_VAPID_PRIVATE_KEY,"base64url"));console.log(e.getPublicKey().toString("base64url"))')
            echo "VITE_VAPID_PUBLIC_KEY=$public" >> "$GITHUB_ENV"
            echo "웹 푸시 공개키는 Secret VAPID_PRIVATE_KEY에서 계산했습니다: $public"
          fi

      - name: 설정 확인
        id: check
        run: |
          missing=""
          if [ -z "$VITE_VAPID_PUBLIC_KEY" ]; then
            echo "::warning::웹 푸시 공개키가 없어 이번 웹앱에서는 알림 켜기가 동작하지 않습니다. Secret VAPID_PRIVATE_KEY를 넣고 다시 실행하세요(SETUP 6-5)."
          fi
          for name in VITE_SUPABASE_URL VITE_SUPABASE_PUBLISHABLE_KEY CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::다음 값이 없어 웹앱을 올리지 않았습니다:$missing. SETUP 6-4를 보고 넣은 뒤 이 워크플로를 손으로 실행하세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$VITE_SUPABASE_PUBLISHABLE_KEY" in
            sb_publishable_*) ;;
            *)
              echo "::error::VITE_SUPABASE_PUBLISHABLE_KEY는 publishable 키(sb_publishable_...)여야 합니다. secret 키는 넣으면 안 됩니다."
              exit 1
              ;;
          esac
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - name: 설치와 시험
        if: steps.check.outputs.ready == 'true'
        working-directory: webapp
        run: |
          npm ci --no-audit --no-fund
          npm test

      - name: Pages 프로젝트 준비
        if: steps.check.outputs.ready == 'true'
        working-directory: webapp
        # 처음 한 번만 만든다. 이미 있으면 실패해도 넘어가고, 토큰 문제는 다음 단계에서 드러난다.
        run: npx --yes wrangler@4.153.0 pages project create stocktrade --production-branch main || echo "이미 있거나 만들 수 없음. 다음 단계에서 올려 본다."

      - name: 빌드하고 올리기
        if: steps.check.outputs.ready == 'true'
        working-directory: webapp
        run: npm run deploy
