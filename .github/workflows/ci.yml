# 올릴 때마다 테스트와 린트를 돌린다. 비밀값은 쓰지 않는다(fake 증권사와 가짜 서버로만 시험).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run --no-sync ruff check
      - run: uv run --no-sync pytest
      # 예약 실행을 부르는 Cloudflare Worker(scheduler/). 러너에 들어 있는 Node로 돌린다.
      - run: node --test scheduler/worker.test.js
      # 폰 웹앱(webapp/): 타입 검사, 테스트, 빌드. 역시 러너에 들어 있는 Node로 돌린다.
      - run: npm ci --no-audit --no-fund
        working-directory: webapp
      - run: npm run typecheck
        working-directory: webapp
      - run: npm test
        working-directory: webapp
      - run: npx vite build
        working-directory: webapp
