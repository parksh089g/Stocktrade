# 미국 주식 하루 실행. 설정 방법은 docs/SETUP.md 4장.
name: trade-us

on:
  schedule:
    # 한국 시간 월~금 23:40(UTC 14:40). 뉴욕 09:40(겨울) 또는 10:40(서머타임), 장 시작 뒤.
    # 모의투자는 미국 정규장 시간에만 주문을 받는다.
    # GitHub 예약 실행은 늦게 시작하거나 아예 빠질 때가 있어서 UTC 16:17(뉴욕 11:17 또는 12:17,
    # 한국 시간 화~토 01:17)에 백업으로 한 번 더 예약한다.
    # 먼저 도는 쪽이 끝나면 나머지는 기록과 알림 없이 끝난다(오류로 끝났으면 다시 돈다).
    # 엔진이 휴장일과 장 시간을 다시 본다.
    - cron: "40 14 * * 1-5"
    - cron: "17 16 * * 1-5"
  workflow_dispatch:
    inputs:
      dry_run:
        description: 시험 실행(계산만 하고 주문하지 않음)
        type: boolean
        default: true

permissions:
  contents: read

# 국내/미국 실행이 겹치지 않게 차례로 돈다(같은 KIS 키의 초당 호출 한도를 나눠 쓰지 않게)
concurrency:
  group: trade
  cancel-in-progress: false

jobs:
  run:
    # 예약 실행은 저장소 변수 SCHEDULE_ENABLED가 true일 때만 돈다. 손으로 실행은 언제나 된다.
    if: github.event_name == 'workflow_dispatch' || vars.SCHEDULE_ENABLED == 'true'
    uses: ./.github/workflows/engine.yml
    with:
      market: US
      dry_run: ${{ inputs.dry_run == true }}
    secrets: inherit
