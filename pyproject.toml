[project]
name = "stocktrade"
version = "0.1.0"
description = "국내/미국 주식 일봉 기반 자동 매매"
requires-python = ">=3.12,<3.13"
dependencies = [
    "anthropic>=2.14.0",
    "cryptography>=50.0.2",
    "holidays>=0.107",
    "httpx>=0.28.1",
    "pandas>=3.1.0",
    "pydantic-settings>=2.16.1",
    "pywebpush>=2.5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["trading"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
# 한국어 문자열/주석의 전각 문자 경고는 끈다
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]
